<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CB-120 테스트 버전</title>
  <script>
    (() => {
      const paths = { codex: './codex/', claude: './claude/' };
      const requested = new URLSearchParams(location.search).get('version');
      const choice = Object.hasOwn(paths, requested) ? requested : (Math.random() < 0.5 ? 'codex' : 'claude');
      location.replace(paths[choice]);
    })();
  </script>
</head>
<body>
  <p>테스트 버전을 불러오는 중입니다.</p>
  <p>직접 선택: <a href="./codex/">Codex 버전</a> · <a href="./claude/">Claude 버전</a></p>
</body>
</html>
